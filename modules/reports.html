<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MMV Traders ERP - Reports</title>

<style>

:root{
    --primary:#0f172a;
    --blue:#2563eb;
    --green:#16a34a;
    --orange:#ea580c;
    --red:#dc2626;
    --border:#e2e8f0;
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#1e293b;
    --muted:#64748b;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    background:var(--primary);
    color:white;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.header h1{
    margin:0;
    font-size:20px;
}

.header span{
    font-size:11px;
    opacity:.75;
}

/* =====================================================
   CONTAINER
===================================================== */

.container{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

/* =====================================================
   SUMMARY CARDS
===================================================== */

.summary-grid{
    display:grid;
    grid-template-columns:
        repeat(5,minmax(0,1fr));
    gap:12px;
    margin-bottom:18px;
}

.summary-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
}

.summary-card small{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-bottom:7px;
}

.summary-card strong{
    display:block;
    font-size:20px;
}

.summary-card.sales strong{
    color:var(--blue);
}

.summary-card.purchase strong{
    color:var(--orange);
}

.summary-card.paid strong{
    color:var(--green);
}

.summary-card.pending strong{
    color:var(--red);
}

/* =====================================================
   REPORT TABS
===================================================== */

.report-tabs{
    display:flex;
    gap:8px;
    overflow:auto;
    margin-bottom:15px;
}

.report-tab{
    border:1px solid var(--border);
    background:white;
    color:var(--muted);
    padding:10px 16px;
    border-radius:8px;
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
}

.report-tab.active{
    background:var(--primary);
    color:white;
    border-color:var(--primary);
}

/* =====================================================
   FILTER
===================================================== */

.filter-card{
    background:white;
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-bottom:15px;
}

.filter-grid{
    display:grid;
    grid-template-columns:
        repeat(5,minmax(0,1fr));
    gap:12px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-size:10px;
    font-weight:700;
    color:#475569;
}

.form-group input,
.form-group select{
    width:100%;
    height:40px;
    border:1px solid var(--border);
    border-radius:8px;
    padding:0 10px;
    background:white;
    color:var(--text);
    font-size:11px;
}

.filter-actions{
    display:flex;
    align-items:end;
    gap:7px;
}

.btn{
    height:40px;
    padding:0 14px;
    border:0;
    border-radius:8px;
    font-size:11px;
    font-weight:700;
}

.btn-primary{
    background:var(--blue);
    color:white;
}

.btn-secondary{
    background:#e2e8f0;
    color:#334155;
}

.btn-success{
    background:var(--green);
    color:white;
}

/* =====================================================
   REPORT HEADER
===================================================== */

.report-card{
    background:white;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
}

.report-header{
    padding:15px 17px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.report-header h2{
    margin:0;
    font-size:15px;
}

.report-header span{
    font-size:10px;
    color:var(--muted);
}

/* =====================================================
   TABLE
===================================================== */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th{
    background:#f8fafc;
    color:#475569;
    font-size:9px;
    text-transform:uppercase;
    padding:11px 9px;
    text-align:left;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
}

td{
    padding:10px 9px;
    font-size:10px;
    border-bottom:1px solid #f1f5f9;
    white-space:nowrap;
}

tbody tr:hover{
    background:#f8fafc;
}

.amount{
    text-align:right;
    font-weight:700;
}

.pending{
    color:var(--red);
    font-weight:800;
}

.paid{
    color:var(--green);
    font-weight:800;
}

.empty{
    padding:40px;
    text-align:center;
    color:var(--muted);
    font-size:11px;
}

/* =====================================================
   REPORT FOOTER
===================================================== */

.report-footer{
    padding:15px;
    display:flex;
    justify-content:flex-end;
    gap:30px;
    border-top:1px solid var(--border);
}

.report-footer div{
    text-align:right;
}

.report-footer small{
    display:block;
    color:var(--muted);
    font-size:9px;
}

.report-footer strong{
    font-size:14px;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1000px){

    .summary-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .filter-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

}

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .header{
        padding:15px;
    }

    .summary-grid{
        grid-template-columns:1fr;
    }

    .filter-grid{
        grid-template-columns:1fr;
    }

    .filter-actions{
        align-items:stretch;
    }

    .filter-actions .btn{
        flex:1;
    }

}

</style>

</head>

<body>

<header class="header">

    <div>
        <h1>MMV Traders ERP</h1>
        <span>Business Reports</span>
    </div>

    <span id="reportDate"></span>

</header>


<main class="container">


    <!-- =================================================
         SUMMARY
    ================================================= -->

    <section class="summary-grid">

        <div class="summary-card sales">

            <small>Total Sales</small>

            <strong id="summarySales">
                ₹0.00
            </strong>

        </div>


        <div class="summary-card purchase">

            <small>Total Purchase</small>

            <strong id="summaryPurchase">
                ₹0.00
            </strong>

        </div>


        <div class="summary-card paid">

            <small>Total Paid</small>

            <strong id="summaryPaid">
                ₹0.00
            </strong>

        </div>


        <div class="summary-card pending">

            <small>Total Pending</small>

            <strong id="summaryPending">
                ₹0.00
            </strong>

        </div>


        <div class="summary-card">

            <small>Transactions</small>

            <strong id="summaryTransactions">
                0
            </strong>

        </div>

    </section>


    <!-- =================================================
         REPORT TABS
    ================================================= -->

    <div class="report-tabs">

        <button
            class="report-tab active"
            data-report="customer"
        >
            Customer Wise
        </button>

        <button
            class="report-tab"
            data-report="sales"
        >
            Sales Wise
        </button>

        <button
            class="report-tab"
            data-report="purchase"
        >
            Purchase Report
        </button>

        <button
            class="report-tab"
            data-report="pending"
        >
            Pending Details
        </button>

        <button
            class="report-tab"
            data-report="product"
        >
            Product Wise
        </button>

    </div>


    <!-- =================================================

    ================================================= -->

    <section class="filter-card">

        <div class="filter-grid">


            <div class="form-group">

                <label>
                    From Date
                </label>

                <input
                    type="date"
                    id="fromDate"

            </div>


            <div class="form-group">

                <label>
                    To Date
                </label>

            </div>


            <div

                <label>
                    Customer
                </label>

                <select id="customerFilter">

                    <option value="">

                    <option value="">

                </select>

            </div>


            <div
                class="form-group"

            >

                <label>
                    Product
                </label>

                <select id="productFilter">

                    <option value="">
                        All Products

                </select>

            </div>


            <div class="filter-actions">

                <button
                    class="btn btn-primary"
                    id="applyBtn"

                >
                    Apply Filter
                </button>

                <button
                    class="btn btn-secondary"

                >

            </div>

        </div>

    </section>


    <!-- =================================================
         REPORT
    ================================================= -->

    <section class="report-card">

        <div class="report-header">

            <div>

                <h2 id="reportTitle">
                    Customer Wise Report
                </h2>

                <span id="reportSubtitle">
                    Customer-wise sales and payment details

            <div>

                <small>Subtotal</small>

                <strong id="footerSubtotal">
                    ₹0.00
                </strong>

            </div>


            <div>

                <small>Paid</small>

                <strong
                    id="footerPaid"
                    class="paid"

                    ₹0.00
                </strong>

                    ₹0.00
                </strong>

</main>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

/*
   IMPORTANT:
   Use the SAME Firebase config already used
   in your sales.html / purchase.html.
*/

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"

};


const app =
    initializeApp(
        firebaseConfig
    );

const db =
    getFirestore(app);


/* =====================================================
   DATA
===================================================== */

let sales = [];
let purchases = [];
let customers = [];
let suppliers = [];
let products = [];

let currentReport =
    "customer";


/* =====================================================
   HELPERS
===================================================== */

function money(value){

    return new Intl.NumberFormat(
        "en-IN",
        {
            style:"currency",
            currency:"INR",
            maximumFractionDigits:2
        }
    ).format(
        Number(value || 0)
    );

}


function number(value){

    return Number(
        value || 0
    );

}


function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   GET DATE
===================================================== */

function getRecordDate(record){

    return String(
        record.date ||
        record.invoiceDate ||
        record.purchaseDate ||
        record.createdDate ||
        record.createdAt?.toDate?.()
            ?.toISOString?.()
            ?.slice(0,10) ||
        ""
    );

}


/* =====================================================
   NORMALIZE CUSTOMER
===================================================== */

function customerName(customer){

    return (
        customer.name ||
        customer.customerName ||
        customer.displayName ||
        customer.code ||
        customer.id ||
        "-"
    );

}


/* =====================================================
   NORMALIZE SUPPLIER
===================================================== */

function supplierName(supplier){

    return (
        supplier.name ||
        supplier.supplierName ||
        supplier.displayName ||
        supplier.code ||
        supplier.id ||
        "-"
    );

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadReportsData(){

    try{

        const [
            salesSnap,
            purchaseSnap,
            customerSnap,
            supplierSnap,
            productSnap
        ] = await Promise.all([

            getDocs(
                collection(
                    db,
                    "sales"
                )
            ),

            getDocs(
                collection(
                    db,
                    "purchases"
                )
            ),

            getDocs(
                collection(
                    db,
                    "customers"
                )
            ),

            getDocs(
                collection(
                    db,
                    "suppliers"
                )
            ),

            getDocs(
                collection(
                    db,
                    "products"
                )
            )

        ]);


        sales =
            salesSnap.docs.map(
                doc => ({
                    id:doc.id,
                    ...doc.data()
                })
            );


        purchases =
            purchaseSnap.docs.map(
                doc => ({
                    id:doc.id,
                    ...doc.data()
                })
            );


        customers =
            customerSnap.docs.map(
                doc => ({
                    id:doc.id,
                    ...doc.data()
                })
            );


        suppliers =
            supplierSnap.docs.map(
                doc => ({
                    id:doc.id,
                    ...doc.data()
                })
            );


        products =
            productSnap.docs.map(
                doc => ({
                    id:doc.id,
                    ...doc.data()
                })
            );


        populateFilters();

        setDefaultDates();

        renderReport();


    }catch(error){

        console.error(
            "Reports loading failed:",
            error
        );

        document.getElementById(
            "reportBody"
        ).innerHTML = `
            <tr>
                <td
                    colspan="12"
                    class="empty"
                >
                    Unable to load report data.
                    Check Firebase configuration.
                </td>
            </tr>
        `;

    }

}


/* =====================================================
   POPULATE FILTERS
===================================================== */

function populateFilters(){

    const customerSelect =
        document.getElementById(
            "customerFilter"
        );

    customers.forEach(
        customer => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                customer.code ||
                customer.customerCode ||
                customer.id;

            option.textContent =
                customerName(customer);

            customerSelect.appendChild(
                option
            );

        }
    );


    const supplierSelect =
        document.getElementById(
            "supplierFilter"
        );

    suppliers.forEach(
        supplier => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                supplier.code ||
                supplier.supplierCode ||
                supplier.id;

            option.textContent =
                supplierName(supplier);

            supplierSelect.appendChild(
                option
            );

        }
    );


    const productSelect =
        document.getElementById(
            "productFilter"
        );

    products.forEach(
        product => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                product.code ||
                product.productCode ||
                product.itemCode ||
                product.id;

            option.textContent =
                product.name ||
                product.productName ||
                product.itemName ||
                product.description ||
                option.value;

            productSelect.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   DEFAULT DATE
===================================================== */

function setDefaultDates(){

    const today =
        new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            today.getDate()
        ).padStart(2,"0");

    const date =
        `${year}-${month}-${day}`;

    document.getElementById(
        "fromDate"
    ).value = date;

    document.getElementById(
        "toDate"
    ).value = date;

    document.getElementById(
        "reportDate"
    ).textContent = date;

}


/* =====================================================
   DATE FILTER
===================================================== */

function filterByDate(records){

    const from =
        document.getElementById(
            "fromDate"
        ).value;

    const to =
        document.getElementById(
            "toDate"
        ).value;


    return records.filter(
        record => {

            const date =
                getRecordDate(record);

            if(!date){
                return false;
            }

            if(
                from &&
                date < from
            ){
                return false;
            }

            if(
                to &&
                date > to
            ){
                return false;
            }

            return true;

        }
    );

}


/* =====================================================
   FIND NAME
===================================================== */

function findCustomerName(value){

    if(!value){
        return "Walk-in Customer";
    }

    const customer =
        customers.find(
            item =>
                String(
                    item.code ||
                    item.customerCode ||
                    item.id ||
                    ""
                ) ===
                String(value)
        );

    return customer
        ? customerName(customer)
        : String(value);

}


function findSupplierName(value){

    if(!value){
        return "-";
    }

    const supplier =
        suppliers.find(
            item =>
                String(
                    item.code ||
                    item.supplierCode ||
                    item.id ||
                    ""
                ) ===
                String(value)
        );

    return supplier
        ? supplierName(supplier)
        : String(value);

}


function findProductName(value){

    if(!value){
        return "-";
    }

    const product =
        products.find(
            item =>
                String(
                    item.code ||
                    item.productCode ||
                    item.itemCode ||
                    item.id ||
                    ""
                ) ===
                String(value)
        );

    return product
        ? (
            product.name ||
            product.productName ||
            product.itemName ||
            product.description ||
            value
        )
        : String(value);

}


/* =====================================================
   SALES CUSTOMER VALUE
===================================================== */

function getSalesCustomer(record){

    return (
        record.customer ||
        record.customerCode ||
        record.customerId ||
        record.customerName ||
        ""
    );

}


/* =====================================================
   PURCHASE SUPPLIER VALUE
===================================================== */

function getPurchaseSupplier(record){

    return (
        record.supplier ||
        record.supplierCode ||
        record.supplierId ||
        record.supplierName ||
        ""
    );

}


/* =====================================================
   RENDER REPORT
===================================================== */

function renderReport(){

    if(currentReport === "customer"){

        renderCustomerReport();

    }
    else if(currentReport === "sales"){

        renderSalesReport();

    }
    else if(currentReport === "purchase"){

        renderPurchaseReport();

    }
    else if(currentReport === "pending"){

        renderPendingReport();

    }
    else if(currentReport === "product"){

        renderProductReport();

    }

}


/* =====================================================
   CUSTOMER WISE
===================================================== */

function renderCustomerReport(){

    const filtered =
        filterByDate(sales);


    const customerFilter =
        document.getElementById(
            "customerFilter"
        ).value;


    const records =
        customerFilter
            ? filtered.filter(
                item =>
                    String(
                        getSalesCustomer(item)
                    ) ===
                    String(customerFilter)
            )
            : filtered;


    document.getElementById(
        "reportTitle"
    ).textContent =
        "Customer Wise Report";


    document.getElementById(
        "reportSubtitle"
    ).textContent =
        "Customer-wise sales and payment details";


    document.getElementById(
        "reportHead"
    ).innerHTML = `
        <tr>
            <th>Date</th>
            <th>Invoice No</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Qty</th>
            <th>Subtotal</th>
            <th>Discount</th>
            <th>Tax</th>
            <th>Total</th>
            <th>Paid</th>
            <th>Pending</th>
        </tr>
    `;


    let subtotal = 0;
    let paid = 0;
    let pending = 0;


    const tbody =
        document.getElementById(
            "reportBody"
        );

    tbody.innerHTML = "";


    records.forEach(
        record => {

            const total =
                number(
                    record.amount ||
                    record.total
                );

            const paidAmount =
                number(
                    record.paid ||
                    record.paidAmount ||
                    record.receivedAmount
                );

            const balance =
                Math.max(
                    0,
                    total - paidAmount
                );


            const items =
                Array.isArray(
                    record.items
                )
                ? record.items
                : [];


            const qty =
                items.reduce(
                    (sum,item) =>
                        sum +
                        number(item.qty),
                    0
                );


            subtotal +=
                number(
                    record.subtotal
                );

            paid +=
                paidAmount;

            pending +=
                balance;


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `
                <td>
                    ${escapeHtml(
                        getRecordDate(record)
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        record.number ||
                        record.invoiceNo ||
                        record.invoiceNumber ||
                        record.id
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        findCustomerName(
                            getSalesCustomer(record)
                        )
                    )}
                </td>

                <td>
                    ${items.length}
                </td>

                <td>
                    ${qty}
                </td>

                <td class="amount">
                    ${money(
                        record.subtotal
                    )}
                </td>

                <td class="amount">
                    ${money(
                        record.discount
                    )}
                </td>

                <td class="amount">
                    ${money(
                        record.tax
                    )}
                </td>

                <td class="amount">
                    ${money(total)}
                </td>

                <td class="amount paid">
                    ${money(paidAmount)}
                </td>

                <td class="amount pending">
                    ${money(balance)}
                </td>
            `;

            tbody.appendChild(
                tr
            );

        }
    );


    updateFooter(
        subtotal,
        paid,
        pending
    );


    updateSummary(
        records
    );

}


/* =====================================================

===================================================== */

function renderSalesReport(){

    const records =
        filterByDate(sales);


    document.getElementById(
        "reportTitle"
    ).textContent =
        "Sales Wise Report";


    document.getElementById(
        "reportSubtitle"
    ).textContent =

    document.getElementById(
        "reportHead"
    ).innerHTML = `
        <tr>
            <th>Date</th>
            <th>Invoice No</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Qty</th>
            <th>Subtotal</th>
            <th>Discount</th>
            <th>Tax</th>

            <th>Paid</th>
            <th>Pending</th>
        </tr>
    `;


    renderSalesRows(

    );

function renderSalesRows(records){

    const tbody =
        document.getElementById(
            "reportBody"
        );

    tbody.innerHTML = "";


    let subtotal = 0;
    let paid = 0;
    let pending = 0;


    records.forEach(
        record => {

            const total =
                number(
                    record.amount ||
                    record.total
                );

            const paidAmount =
                number(
                    record.paid ||
                    record.paidAmount ||
                    record.receivedAmount
                );

            const balance =
                Math.max(
                    0,
                    total - paidAmount
                );


            const items =
                Array.isArray(
                    record.items
                )
                ? record.items
                : [];


            const qty =
                items.reduce(
                    (sum,item) =>
                        sum +
                        number(item.qty),
                    0
                );


            subtotal +=
                number(record.subtotal);

            paid +=
                paidAmount;

            pending +=
                balance;


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `
                <td>${escapeHtml(
                    getRecordDate(record)
                )}</td>

                <td>${escapeHtml(
                    record.number ||
                    record.invoiceNo ||
                    record.invoiceNumber ||
                    record.id
                )}</td>

                <td>${escapeHtml(
                    findCustomerName(
                        getSalesCustomer(record)
                    )
                )}</td>

                <td>${items.length}</td>

                <td>${qty}</td>

                <td class="amount">
                    ${money(record.subtotal)}
                </td>

                <td class="amount">
                    ${money(record.discount)}
                </td>

                <td class="amount">
                    ${money(record.tax)}
                </td>

                <td class="amount">
                    ${money(total)}
                </td>

                <td class="amount paid">
                    ${money(paidAmount)}
                </td>

                <td class="amount pending">
                    ${money(balance)}
                </td>
            `;

            tbody.appendChild(
                tr
            );

        }
    );


    updateFooter(
        subtotal,
        paid,
        pending
    );


    updateSummary(
        records
    );

}

/* =====================================================
   PENDING DETAILS
===================================================== */

function renderPendingReport(){

    const records =
        filterByDate(sales);


    document.getElementById(
        "reportTitle"
    ).textContent =
        "Pending Details";


    document.getElementById(
        "reportSubtitle"
    ).textContent =
        "Customer outstanding / receivable details";


    document.getElementById(
        "reportHead"
    ).innerHTML = `
        <tr>
            <th>Date</th>
            <th>Invoice No</th>
            <th>Customer</th>
            <th>Bill Amount</th>
            <th>Paid</th>
            <th>Pending</th>
            <th>Payment Status</th>
        </tr>
    `;


    const tbody =
        document.getElementById(
            "reportBody"
        );

    tbody.innerHTML = "";


    let pendingTotal = 0;
    let paidTotal = 0;


    records.forEach(
        record => {

            const total =
                number(
                    record.amount ||
                    record.total
                );

            const paid =
                number(
                    record.paid ||
                    record.paidAmount ||
                    record.receivedAmount
                );

            const balance =
                Math.max(
                    0,
                    total - paid
                );


            if(balance <= 0){
                return;
            }


            pendingTotal +=
                balance;

            paidTotal +=
                paid;


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `
                <td>${escapeHtml(
                    getRecordDate(record)
                )}</td>

                <td>${escapeHtml(
                    record.number ||
                    record.invoiceNo ||
                    record.invoiceNumber ||
                    record.id
                )}</td>

                <td>${escapeHtml(
                    findCustomerName(
                        getSalesCustomer(record)
                    )
                )}</td>

                <td class="amount">
                    ${money(total)}
                </td>

                <td class="amount paid">
                    ${money(paid)}
                </td>

                <td class="amount pending">
                    ${money(balance)}
                </td>

                <td class="pending">
                    Pending
                </td>
            `;

            tbody.appendChild(
                tr
            );

        }
    );


    updateFooter(
        0,
        paidTotal,
        pendingTotal
    );


    document.getElementById(
        "summarySales"
    ).textContent =
        money(
            records.reduce(
                (sum,item) =>
                    sum +
                    number(
                        item.amount ||
                        item.total
                    ),
                0
            )
        );


}


/* =====================================================
   PRODUCT WISE
===================================================== */

function renderProductReport(){

    const records =
        filterByDate(sales);


    const productFilter =
        document.getElementById(
            "productFilter"
        ).value;


    document.getElementById(
        "reportTitle"
    ).textContent =
        "Product Wise Report";


    document.getElementById(
        "reportSubtitle"
    ).textContent =
        "Product-wise sales movement";


    document.getElementById(
        "reportHead"
    ).innerHTML = `
        <tr>
            <th>Date</th>
            <th>Invoice No</th>
            <th>Customer</th>
            <th>Product</th>
            <th>Qty</th>
            <th>KG</th>
            <th>Rate</th>
            <th>Amount</th>
        </tr>
    `;


    const tbody =
        document.getElementById(
            "reportBody"
        );

    tbody.innerHTML = "";


    let total = 0;


    records.forEach(
        record => {

            const items =
                Array.isArray(
                    record.items
                )
                ? record.items
                : [];


            items.forEach(
                item => {

                    const itemProduct =
                        item.product ||
                        item.productCode ||
                        item.code ||
                        "";


                    if(
                        productFilter &&
                        String(
                            itemProduct
                        ) !==
                        String(productFilter)
                    ){
                        return;
                    }


                    const amount =
                        number(
                            item.amount ||
                            item.bundleAmount ||
                            item.looseKgAmount
                        );


                    total +=
                        amount;


                    const tr =
                        document.createElement(
                            "tr"
                        );


                    tr.innerHTML = `
                        <td>${escapeHtml(
                            getRecordDate(record)
                        )}</td>

                        <td>${escapeHtml(
                            record.number ||
                            record.invoiceNo ||
                            record.invoiceNumber ||
                            record.id
                        )}</td>

                        <td>${escapeHtml(
                            findCustomerName(
                                getSalesCustomer(record)
                            )
                        )}</td>

                        <td>${escapeHtml(
                            item.name ||
                            item.productName ||
                            findProductName(
                                itemProduct
                            )
                        )}</td>

                        <td>
                            ${number(item.qty)}
                        </td>

                        <td>
                            ${number(
                                item.totalKg ||
                                item.looseKg
                            )}
                        </td>

                        <td class="amount">
                            ${money(
                                item.perKg ||
                                item.rate
                            )}
                        </td>

                        <td class="amount">
                            ${money(amount)}
                        </td>
                    `;

                    tbody.appendChild(
                        tr
                    );

                }
            );

        }
    );


    updateFooter(
        total,
        0,
        0
    );


    document.getElementById(
        "summaryTransactions"
    ).textContent =
        tbody.children.length;

}


/* =====================================================
   FOOTER
===================================================== */

function updateFooter(
    subtotal,
    paid,
    pending
){

    document.getElementById(
        "footerSubtotal"
    ).textContent =
        money(subtotal);

    document.getElementById(
        "footerPaid"
    ).textContent =
        money(paid);

    document.getElementById(
        "footerPending"
    ).textContent =
        money(pending);

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(records){

    let salesTotal = 0;
    let paidTotal = 0;
    let pendingTotal = 0;


    records.forEach(
        record => {

            const total =
                number(
                    record.amount ||
                    record.total
                );

            const paid =
                number(
                    record.paid ||
                    record.paidAmount ||
                    record.receivedAmount
                );

            salesTotal +=
                total;

            paidTotal +=
                paid;

            pendingTotal +=
                Math.max(
                    0,
                    total - paid
                );

        }
    );


    document.getElementById(
        "summarySales"
    ).textContent =
        money(salesTotal);

    document.getElementById(
        "summaryPaid"
    ).textContent =
        money(paidTotal);

    document.getElementById(
        "summaryPending"
    ).textContent =
        money(pendingTotal);

    document.getElementById(
        "summaryTransactions"
    ).textContent =
        records.length;

}


/* =====================================================
   TABS
===================================================== */

document
    .querySelectorAll(
        ".report-tab"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    document
                        .querySelectorAll(
                            ".report-tab"
                        )
                        .forEach(
                            item =>
                                item.classList.remove(
                                    "active"
                                )
                        );


                    this.classList.add(
                        "active"
                    );


                    currentReport =
                        this.dataset.report;


                    const customerGroup =
                        document.getElementById(
                            "customerFilterGroup"
                        );

                    const supplierGroup =
                        document.getElementById(
                            "supplierFilterGroup"
                        );

                    const productGroup =
                        document.getElementById(
                            "productFilterGroup"
                        );


                    customerGroup.style.display =
                        currentReport === "customer"
                            ? "block"
                            : "none";


                    supplierGroup.style.display =
                        currentReport === "purchase"
                            ? "block"
                            : "none";


                    productGroup.style.display =
                        currentReport === "product"
                            ? "block"
                            : "none";


                    renderReport();

                }
            );

        }
    );
