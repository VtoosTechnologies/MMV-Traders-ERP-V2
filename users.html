<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b3d91"
    >

    <title>Users | MMV Traders ERP</title>

    <!-- Existing application stylesheet -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <!-- Users page stylesheet -->
    <style>

        .users-page {
            padding: 28px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
        }

        .page-title p {
            margin: 6px 0 0;
            color: #718096;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: 0;
            border-radius: 10px;
            padding: 11px 17px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-primary {
            background: #0b3d91;
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        .btn-light {
            background: #eef4ff;
            color: #0b3d91;
        }

        .summary-grid {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 22px;
        }

        .summary-card {
            background: #fff;
            border: 1px solid #e4e9f1;
            border-radius: 14px;
            padding: 20px;
            box-shadow:
                0 4px 14px rgba(15, 23, 42, 0.04);
        }

        .summary-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-label {
            color: #718096;
            font-size: 13px;
            font-weight: 600;
        }

        .summary-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: #eef4ff;
            color: #0b3d91;
            font-weight: 800;
        }

        .summary-value {
            margin-top: 12px;
            font-size: 26px;
            font-weight: 800;
            color: #10233f;
        }

        .users-card {
            background: #fff;
            border: 1px solid #e4e9f1;
            border-radius: 16px;
            overflow: hidden;
            box-shadow:
                0 4px 18px rgba(15, 23, 42, 0.04);
        }

        .table-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 18px 20px;
            border-bottom: 1px solid #edf0f5;
        }

        .search-box {
            position: relative;
            width: 330px;
        }

        .search-box input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #dce3ed;
            border-radius: 10px;
            padding: 11px 14px 11px 38px;
            outline: none;
            font-size: 14px;
        }

        .search-box input:focus {
            border-color: #0b3d91;
            box-shadow:
                0 0 0 3px rgba(11, 61, 145, 0.08);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #7b8798;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        .users-table th {
            background: #f8fafc;
            color: #64748b;
            text-align: left;
            padding: 14px 18px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .users-table td {
            padding: 16px 18px;
            border-top: 1px solid #edf0f5;
            font-size: 14px;
            color: #253858;
        }

        .user-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #e9f0ff;
            color: #0b3d91;
            font-weight: 800;
        }

        .user-name {
            font-weight: 700;
            color: #172b4d;
        }

        .user-email {
            margin-top: 3px;
            color: #8793a5;
            font-size: 12px;
        }

        .role-badge,
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
        }

        .role-badge {
            background: #eef4ff;
            color: #0b3d91;
        }

        .status-active {
            background: #e9f8ef;
            color: #198754;
        }

        .status-inactive {
            background: #fff0f0;
            color: #c0392b;
        }

        .action-btn {
            border: 1px solid #dce3ed;
            background: #fff;
            color: #40516d;
            border-radius: 8px;
            padding: 7px 11px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .action-btn:hover {
            background: #f7f9fc;
        }

        .empty-state {
            padding: 55px 20px;
            text-align: center;
            color: #8793a5;
        }

        .empty-icon {
            width: 54px;
            height: 54px;
            margin: 0 auto 12px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #f0f4fa;
            color: #718096;
            font-size: 22px;
        }

        .page-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 28px;
            padding: 18px 2px;
            color: #7b8798;
            font-size: 12px;
        }

        @media (max-width: 1100px) {

            .summary-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 700px) {

            .users-page {
                padding: 18px;
            }

            .page-header,
            .table-toolbar,
            .page-footer {
                align-items: flex-start;
                flex-direction: column;
            }

            .header-actions,
            .search-box {
                width: 100%;
            }

            .search-box {
                width: 100%;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>


<body>

    <div class="users-page">

        <!-- =====================================================
             PAGE HEADER
        ====================================================== -->

        <header class="page-header">

            <div class="page-title">

                <h1>
                    Users
                </h1>

                <p>
                    Manage ERP users, roles and account status.
                </p>

            </div>


            <div class="header-actions">

                <button
                    type="button"
                    class="btn btn-light"
                    id="refreshUsersBtn"
                >
                    ↻ Refresh
                </button>


                <button
                    type="button"
                    class="btn btn-primary"
                    id="addUserBtn"
                >
                    + Add User
                </button>

            </div>

        </header>


        <!-- =====================================================
             SUMMARY
        ====================================================== -->

        <section class="summary-grid">

            <div class="summary-card">

                <div class="summary-top">

                    <span class="summary-label">
                        Total Users
                    </span>

                    <div class="summary-icon">
                        U
                    </div>

                </div>

                <div
                    class="summary-value"
                    id="totalUsers"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-top">

                    <span class="summary-label">
                        Active Users
                    </span>

                    <div class="summary-icon">
                        ✓
                    </div>

                </div>

                <div
                    class="summary-value"
                    id="activeUsers"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-top">

                    <span class="summary-label">
                        Inactive Users
                    </span>

                    <div class="summary-icon">
                        –
                    </div>

                </div>

                <div
                    class="summary-value"
                    id="inactiveUsers"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-top">

                    <span class="summary-label">
                        Administrators
                    </span>

                    <div class="summary-icon">
                        A
                    </div>

                </div>

                <div
                    class="summary-value"
                    id="adminUsers"
                >
                    0
                </div>

            </div>

        </section>


        <!-- =====================================================
             USERS TABLE
        ====================================================== -->

        <section class="users-card">

            <div class="table-toolbar">

                <div>

                    <strong>
                        ERP Users
                    </strong>

                </div>


                <div class="search-box">

                    <span class="search-icon">
                        ⌕
                    </span>

                    <input
                        type="search"
                        id="userSearch"
                        placeholder="Search users..."
                        autocomplete="off"
                    >

                </div>

            </div>


            <div class="table-wrap">

                <table class="users-table">

                    <thead>

                        <tr>

                            <th>
                                User
                            </th>

                            <th>
                                Role
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Created
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="usersTableBody">

                        <tr>

                            <td colspan="5">

                                <div class="empty-state">

                                    <div class="empty-icon">
                                        U
                                    </div>

                                    <div>
                                        Loading users...
                                    </div>

                                </div>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>


        <!-- =====================================================
             FOOTER
        ====================================================== -->

        <footer class="page-footer">

            <span>
                © MMV Traders ERP
            </span>

            <span>
                Secure Business Management System
            </span>

        </footer>

    </div>


    <!-- =========================================================
         USERS MODULE
    ========================================================== -->

    <script
        type="module"
        src="../js/users.js"
    ></script>

</body>
</html>
